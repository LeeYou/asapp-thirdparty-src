    commercial_use_allowed: true
    patch_count: 0
    patch_dir: patches/opencv
    owner: ""
    modules: []
    notes: "Governed OpenCV 4.5.5 for Win7. Trimmed BUILD_LIST=core,imgproc,imgcodecs; no CUDA/OpenCL/IPP. Recipe cmake/packages/opencv.cmake; extract via scripts/extract_archive.ps1 -Package opencv. TWO LAYERS: (1) SHIP SLICE=shared-release only (Win/Linux; -Linkage shared -Config release); (2) library ALWAYS STATIC (BUILD_SHARED_LIBS forced OFF)—no opencv DLLs/SOs; private-link into AsApp image facade to avoid third-party OpenCV version clashes; do not re-export cv::* to plugins. Non-ship slices are opt-in only—do not SyncToPrebuilt by mistake (build.ps1 defaults Linkage=static → wrong slice name)."
